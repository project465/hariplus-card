name: backend-test
on:
  workflow_dispatch:
    inputs:
      code:
        description: "테스트용 인증코드"
        default: "HARI-TEST-0001"
  push:
    paths: [".github/workflows/backend-test.yml", "test/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node test/backend-test.mjs
        env:
          TEST_CODE: ${{ github.event.inputs.code || 'HARI-TEST-0002' }}
