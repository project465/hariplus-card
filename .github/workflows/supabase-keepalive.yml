name: supabase-keepalive
# Supabase 무료 플랜은 7일 동안 활동이 없으면 프로젝트를 일시정지한다.
# 이틀에 한 번 컬러카드 DB에 가벼운 조회를 보내 '활동 있음' 상태를 유지한다(대표 2026-10-26).
on:
  schedule:
    - cron: "17 0 */2 * *"
  workflow_dispatch:
  push:
    paths: [".github/workflows/supabase-keepalive.yml"]
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping supabase
        env:
          URL: https://ylmhkwetuodxhcgqxckf.supabase.co
          KEY: sb_publishable_rBEz3bJbiNIQu0Dd285rTQ_l-H3hVKI
        run: |
          host=${URL#https://}
          dns=$(getent hosts "$host" | head -1 || true)
          cname=$(dig +short CNAME "$host" | head -1 || true)
          r=$(curl -sS -o b1.txt -w "%{http_code}" "$URL/rest/v1/draws?select=id&limit=1" -H "apikey: $KEY" || true)
          a=$(curl -sS -o b2.txt -w "%{http_code}" "$URL/auth/v1/health" -H "apikey: $KEY" || true)
          echo "::notice::dns=[$dns] cname=[$cname] rest=$r $(head -c 120 b1.txt 2>/dev/null | tr -d '\n') | auth=$a $(head -c 120 b2.txt 2>/dev/null | tr -d '\n')"
          # 서버가 응답만 하면 활동으로 기록된다. 응답이 없거나(000) 5xx면 실패로 표시
          case "$r" in 000|5*|"") exit 1;; esac
